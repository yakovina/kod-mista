<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- Шаблон OG-картинок 1200×630 у стилі «Мемфіс з ілюстрації».
     Рендерить scripts/render-og.mjs:
     og.html            → public/og-test.png
     og.html?l=<slug>   → public/og-<slug>.png -->
<style>
@font-face { font-family: "Open Sans"; src: url("../public/fonts/opensans.woff2") format("woff2"); font-weight: 300 800; }
@font-face { font-family: "Lora"; src: url("../public/fonts/lora.woff2") format("woff2"); font-weight: 400 700; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #2E2E2B; font-family: "Open Sans", sans-serif;
  background-color: #F3E6C4; background-image: radial-gradient(rgba(30,88,102,.18) 1.6px, transparent 2px); background-size: 24px 24px; }
.wrap { position: relative; width: 1200px; height: 630px; padding: 70px 72px; display: flex; gap: 60px; align-items: center; }
.card { flex: 0 0 520px; border: 4px solid #2E2E2B; box-shadow: 12px 12px 0 #D66C46; background: #FBF6EA; }
.card img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; }
.right { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; }
.logo { height: 64px; padding: 10px 14px; border: 4px solid #2E2E2B; background: #FBF6EA; }
.logo img { height: 100%; }
.kicker { margin-top: 28px; font-size: 26px; font-weight: 800; color: #55574F; }
h1 { margin: 14px 0 0; padding: 10px 20px 14px; background: #E9C150; border: 4px solid #2E2E2B; box-shadow: 10px 10px 0 #1E5866; font-size: 84px; font-weight: 800; line-height: 1; }
h1.lvl { font-size: 54px; line-height: 1.06; box-shadow: 10px 10px 0 #D66C46; }
p { margin: 30px 0 0; font-family: "Lora", serif; font-size: 27px; line-height: 1.4; }
.star { position: absolute; width: 70px; }
.star polygon { fill: #93221A; stroke: #2E2E2B; stroke-width: 3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><img src="../public/art/cover.jpg" alt=""></div>
  <div class="right">
    <div class="logo"><img src="../public/hmarochos_logo_new.svg" alt=""></div>
    <div class="kicker" id="kicker">Тест · 8 питань</div>
    <h1 id="title">Код міста</h1>
    <p id="lead">Будівлі, назви вулиць і пам’ятники</p>
  </div>
  <svg class="star" style="right: 40px; top: 30px" viewBox="0 0 60 60"><polygon points="30,3 37,22 57,22 41,34 47,54 30,42 13,54 19,34 3,22 23,22"/></svg>
</div>
<script>
  const LV = {
    tourist: { title: "Турист у своєму місті", range: "0–2 бали" },
    citizen: { title: "Допитливий містянин", range: "3–5 балів" },
    keeper: { title: "Хранитель коду міста", range: "6–8 балів" },
  };
  const lv = LV[new URLSearchParams(location.search).get("l")];
  if (lv) {
    document.getElementById("kicker").textContent = `Мій результат · ${lv.range}`;
    const t = document.getElementById("title");
    t.textContent = lv.title;
    t.className = "lvl";
    document.getElementById("lead").textContent = "Тест «Код міста» від Хмарочоса";
  }
</script>
</body>
</html>
