<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- OG-картинки 1200×630 у стилі «Мемфіс з ілюстрації». Рендерить scripts/render-og.mjs:
     og.html → public/og-test.png;  og.html?l=<slug> → public/og-<slug>.png -->
<style>
@font-face { font-family: "Open Sans"; src: url("../public/fonts/hm/open-sans-v29-latin_cyrillic-ext-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Open Sans"; src: url("../public/fonts/hm/open-sans-v29-latin_cyrillic-ext-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Lora"; src: url("../public/fonts/hm/lora-v24-latin_cyrillic-ext-regular.woff2") format("woff2"); font-weight: 400; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #2E2E2B; font-family: "Open Sans", sans-serif;
  background-color: #F3E6C4; background-image: radial-gradient(rgba(30,88,102,.2) 1.8px, transparent 2.2px); background-size: 26px 26px; }
.wrap { position: relative; width: 1200px; height: 630px; }
.d { position: absolute; overflow: visible; }
.d * { stroke: #2E2E2B; stroke-width: 3; }
.card { position: absolute; left: 64px; top: 92px; width: 540px; border: 3px solid #2E2E2B; box-shadow: 12px 12px 0 #D66C46; background: #FBF6EA; }
.card img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; }
.right { position: absolute; left: 664px; top: 64px; width: 480px; display: flex; flex-direction: column; align-items: flex-start; }
.logo { height: 58px; padding: 8px 12px; border: 3px solid #2E2E2B; background: #FBF6EA; }
.logo img { height: 100%; display: block; }
.kicker { margin-top: 26px; font-size: 26px; font-weight: 700; color: #55574F; }
h1 { margin: 12px 0 0; padding: 10px 22px 14px; background: #E9C150; border: 3px solid #2E2E2B; box-shadow: 9px 9px 0 #1E5866; font-size: 76px; font-weight: 700; line-height: 1; white-space: nowrap; }
p.lead { margin: 30px 0 0; max-width: 420px; font-family: "Lora", serif; font-size: 25px; line-height: 1.4; }
.cta { margin-top: 30px; display: inline-flex; align-items: center; gap: 18px; padding: 14px 24px; background: #D66C46; border: 3px solid #2E2E2B; box-shadow: 6px 6px 0 #2E2E2B; font-size: 26px; font-weight: 700; }
.lvlHead { margin-top: 24px; display: flex; align-items: center; gap: 18px; }
.badge { width: 118px; height: 118px; border-radius: 50%; border: 3px solid #2E2E2B; background: #1E5866; box-shadow: 6px 6px 0 #E9C150; color: #FBF6EA; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.badge b { font-size: 40px; }
.badge small { margin-top: 6px; font-size: 18px; color: #79ABB7; }
.lvlCaption { font-size: 26px; font-weight: 700; color: #55574F; line-height: 1.25; }
h1.lvl { font-size: 56px; line-height: 1.06; box-shadow: 9px 9px 0 #D66C46; white-space: normal; }
.scale { margin-top: 30px; display: flex; border: 3px solid #2E2E2B; background: #FBF6EA; }
.scale span { position: relative; padding: 12px 16px; font-size: 18px; font-weight: 700; color: #55574F; border-right: 3px solid #2E2E2B; }
.scale span:last-child { border-right: 0; }
.scale span.on { background: #1E5866; color: #FBF6EA; }
.scale span.on::after { content: "ви тут"; position: absolute; top: -18px; right: 10px; padding: 2px 8px; background: #E9C150; color: #2E2E2B; border: 2px solid #2E2E2B; font-size: 14px; }
.lvlOnly { display: none !important; }
body.level .testOnly { display: none !important; }
body.level .lvlOnly { display: flex !important; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="d" style="right: 40px; top: 26px; width: 170px" viewBox="0 0 160 120">
    <line x1="96" y1="58" x2="10" y2="12" /><line x1="96" y1="58" x2="22" y2="104" />
    <circle cx="120" cy="52" r="32" fill="#1E5866" /><circle cx="110" cy="40" r="8" fill="#79ABB7" style="stroke:none" />
  </svg>
  <svg class="d" style="left: 24px; top: 24px; width: 56px" viewBox="0 0 60 60"><polygon fill="#93221A" points="30,3 37,22 57,22 41,34 47,54 30,42 13,54 19,34 3,22 23,22"/></svg>
  <svg class="d" style="left: 560px; top: 520px; width: 40px" viewBox="0 0 60 60"><polygon fill="#2E2E2B" points="30,3 37,22 57,22 41,34 47,54 30,42 13,54 19,34 3,22 23,22"/></svg>
  <svg class="d" style="right: -6px; bottom: -6px; width: 190px" viewBox="0 0 200 200">
    <path fill="#1E5866" d="M200 0 A 200 200 0 0 0 0 200 L 28 200 A 172 172 0 0 1 200 28 Z" />
    <path fill="#3F7F8E" d="M200 28 A 172 172 0 0 0 28 200 L 52 200 A 148 148 0 0 1 200 52 Z" />
    <path fill="#79ABB7" d="M200 52 A 148 148 0 0 0 52 200 L 74 200 A 126 126 0 0 1 200 74 Z" />
  </svg>

  <div class="card"><img src="../public/art/cover.jpg" alt=""></div>

  <div class="right">
    <div class="logo"><img src="../public/hmarochos_logo_new.svg" alt=""></div>
    <div class="kicker testOnly">Тест · 8 питань</div>
    <h1 class="testOnly">Код міста</h1>
    <p class="lead testOnly">Будівлі, назви вулиць і пам’ятники. Наскільки добре ви читаєте своє місто?</p>
    <div class="cta testOnly">Пройти тест <span>→</span></div>
    <div class="lvlHead lvlOnly">
      <div class="badge"><b id="range">6–8</b><small id="unit">балів</small></div>
      <div class="lvlCaption">Мій результат<br>у тесті «Код міста»</div>
    </div>
    <h1 class="lvl lvlOnly" id="title" style="margin-top: 26px">Хранитель коду міста</h1>
    <div class="scale lvlOnly" id="scale"></div>
  </div>
</div>
<script>
  const LV = [
    { slug: "tourist", title: "Турист у своєму місті", short: "Турист", range: "0–2", unit: "бали" },
    { slug: "citizen", title: "Допитливий містянин", short: "Містянин", range: "3–5", unit: "балів" },
    { slug: "keeper", title: "Хранитель коду міста", short: "Хранитель", range: "6–8", unit: "балів" },
  ];
  const slug = new URLSearchParams(location.search).get("l");
  const lv = LV.find((l) => l.slug === slug);
  if (lv) {
    document.body.classList.add("level");
    document.getElementById("title").textContent = lv.title;
    document.getElementById("range").textContent = lv.range;
    document.getElementById("unit").textContent = lv.unit;
    document.getElementById("scale").innerHTML = LV.map((l) => `<span class="${l.slug === slug ? "on" : ""}">${l.short}</span>`).join("");
  }
</script>
</body>
</html>
