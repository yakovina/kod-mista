<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- Шаблон OG-картинок 1200×630. Рендерить scripts/render-og.mjs:
     og.html            → public/og-test.png
     og.html?l=<slug>   → public/og-<slug>.png -->
<style>
@font-face { font-family: "Open Sans"; src: url("../public/fonts/opensans.woff2") format("woff2"); font-weight: 300 800; }
@font-face { font-family: "Lora"; src: url("../public/fonts/lora.woff2") format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F3E6C4; color: #2E2E2B; font-family: "Open Sans", sans-serif; }
.wrap { width: 1200px; height: 630px; padding: 56px 64px; display: flex; gap: 56px; align-items: center; }
.left { flex: 1 1 auto; display: flex; flex-direction: column; height: 100%; }
.logo { height: 44px; width: auto; align-self: flex-start; }
.kicker { margin-top: auto; font-size: 26px; font-weight: 700; color: #93221A; }
h1 { margin: 10px 0 0; font-size: 104px; font-weight: 800; line-height: .98; letter-spacing: -.025em; }
h1.lvl { font-size: 70px; line-height: 1.04; }
p { margin: 22px 0 auto; font-family: "Lora", serif; font-size: 28px; line-height: 1.45; color: #55574F; max-width: 560px; }
.card { flex: 0 0 500px; border: 3px solid #2E2E2B; background: #FBF6EA; }
.card img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <img class="logo" src="../public/hmarochos_logo_new.svg" alt="">
    <div class="kicker" id="kicker">Тест Хмарочоса</div>
    <h1 id="title">Код міста</h1>
    <p id="lead">Будівлі, назви вулиць і пам’ятники. Перевірте, як добре ви читаєте своє місто.</p>
  </div>
  <div class="card"><img src="../public/art/cover.jpg" alt=""></div>
</div>
<script>
  const LV = {
    tourist: { title: "Турист у своєму місті", range: "0–2 бали" },
    citizen: { title: "Допитливий містянин", range: "3–5 балів" },
    keeper: { title: "Хранитель коду міста", range: "6–8 балів" },
  };
  const lv = LV[new URLSearchParams(location.search).get("l")];
  if (lv) {
    document.getElementById("kicker").textContent = `Мій результат · ${lv.range}`;
    const t = document.getElementById("title");
    t.textContent = lv.title;
    t.className = "lvl";
    document.getElementById("lead").textContent = "Тест «Код міста» від Хмарочоса.";
  }
</script>
</body>
</html>
