<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- OG 1200×630 у стилі «Вітраж на світлій стіні». Рендерить scripts/render-og.mjs:
     og.html → public/og-test.png (обкладинка на весь кадр);
     og.html?l=<slug> → public/og-<slug>.png (персонаж ліворуч, звання праворуч). -->
<style>
@font-face { font-family: "Open Sans"; src: url("../public/fonts/hm/open-sans-v29-latin_cyrillic-ext-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Lora"; src: url("../public/fonts/hm/lora-v24-latin_cyrillic-ext-700.woff2") format("woff2"); font-weight: 700; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #e5e2d9; color: #30302e; font-family: "Open Sans", sans-serif; }
.coverWrap { position: relative; width: 1200px; height: 630px; }
.cover { width: 1200px; height: 630px; object-fit: cover; object-position: 50% 18%; display: block; }
.plate { position: absolute; left: 56px; bottom: 56px; padding: 18px 28px 22px; background: #f2d98f; border: 3px solid #30302e; border-radius: 6px; outline: 2px solid #fbf7ec; outline-offset: -5px; }
.plateTitle { font-family: "Lora", serif; font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -.01em; }
.plateSub { margin-top: 10px; font-size: 22px; font-weight: 500; color: #30302e; }
.lvl { display: none; position: relative; width: 1200px; height: 630px; }
body.level .coverWrap { display: none; }
body.level .lvl { display: block; }
.fig { position: absolute; left: 40px; top: 0; height: 574px; width: 520px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.fig img { display: block; width: auto; height: auto; }
.fig.tourist img { width: 470px; }
.fig.citizen img { width: 520px; align-self: flex-start; }
.fig.keeper img { height: 1280px; margin-bottom: -710px; }
.sill { position: absolute; left: 40px; top: 574px; width: 520px; height: 2px; background: #30302e; }
.text { position: absolute; left: 610px; top: 0; height: 630px; width: 540px; display: flex; flex-direction: column; justify-content: center; }
.text h1 { margin: 0; font-family: "Lora", serif; font-weight: 700; font-size: 72px; line-height: 1.08; letter-spacing: -.01em; }
.text .range { margin-top: 20px; font-size: 28px; font-weight: 500; color: #414a4b; }
.text .brand { position: absolute; right: 0; bottom: 56px; font-size: 24px; font-weight: 500; color: #414a4b; }
.text .brand i { font-style: normal; color: #b0a295; }
</style>
</head>
<body>
<div class="coverWrap">
  <img class="cover" src="../public/art/cover.jpg" alt="">
  <div class="plate"><div class="plateTitle">Код міста</div><div class="plateSub">Тест Хмарочоса · 8 питань про будівлі, вулиці й пам’ятники</div></div>
</div>
<div class="lvl">
  <div class="fig" id="fig"><img id="char" src="" alt=""></div>
  <div class="sill"></div>
  <div class="text">
    <h1 id="title"></h1>
    <div class="range" id="range"></div>
    <div class="brand">Код міста <i>·</i> Хмарочос</div>
  </div>
</div>
<script>
  const LV = {
    tourist: { title: "Турист у своєму місті", range: "0–2 бали з 8" },
    citizen: { title: "Допитливий містянин", range: "3–5 балів з 8" },
    keeper: { title: "Хранитель коду міста", range: "6–8 балів з 8" },
  };
  const slug = new URLSearchParams(location.search).get("l");
  const lv = LV[slug];
  if (lv) {
    document.body.classList.add("level");
    document.getElementById("fig").classList.add(slug);
    document.getElementById("char").src = `../public/art/char-${slug}.webp`;
    document.getElementById("title").textContent = lv.title.replace(/ у /g, " у\u00a0");
    document.getElementById("range").textContent = lv.range;
  }
</script>
</body>
</html>
